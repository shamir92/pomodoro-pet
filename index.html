<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Pomodoro Pet</title>
</head>
<body>
  <div class="pet-container" id="petContainer">
    <!-- Timer display -->
    <div class="timer" id="timerDisplay">25:00</div>

    <!-- Phase label -->
    <div class="phase" id="phaseLabel">Work</div>

    <!-- The pet -->
    <div class="pet" id="pet">
      <div class="pet-body">
        <div class="pet-face">
          <div class="eye left" id="eyeLeft"></div>
          <div class="eye right" id="eyeRight"></div>
          <div class="mouth" id="mouth"></div>
        </div>
        <div class="pet-ear left"></div>
        <div class="pet-ear right"></div>
      </div>
      <div class="pet-shadow"></div>
      <div class="pet-tail" id="petTail"></div>
    </div>

    <!-- Status text -->
    <div class="status" id="statusText">Let's work! 🐱</div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn" id="startBtn" title="Start">▶</button>
      <button class="btn" id="pauseBtn" title="Pause" style="display:none">⏸</button>
      <button class="btn" id="resetBtn" title="Reset">↺</button>
      <button class="btn" id="settingsBtn" title="Settings">⚙</button>
    </div>

    <!-- Settings panel -->
    <div class="settings-panel" id="settingsPanel" style="display:none">
      <div class="setting-row">
        <label>Work</label>
        <input type="number" id="workInput" min="1" max="90" value="25" />
      </div>
      <div class="setting-row">
        <label>Short Break</label>
        <input type="number" id="shortInput" min="1" max="30" value="5" />
      </div>
      <div class="setting-row">
        <label>Long Break</label>
        <input type="number" id="longInput" min="1" max="60" value="15" />
      </div>
      <div class="setting-row">
        <label>Goal (pomodoros)</label>
        <input type="number" id="goalInput" min="1" max="12" value="4" />
      </div>
      <button class="btn small" id="saveBtn">Save</button>
    </div>

    <!-- Close button -->
    <button class="close-btn" id="closeBtn">×</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
